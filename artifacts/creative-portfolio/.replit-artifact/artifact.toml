kind = "web"
previewPath = "/"
title = "Creative Portfolio"
description = "A responsive, interactive multi-page portfolio showcasing performance projects, psychology research, creative skills, and contact information."
version = "1.0.0"
id = "artifacts/creative-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23042

[services.development]
run = "pnpm --filter @workspace/creative-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/creative-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/creative-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23042"
BASE_PATH = "/"
